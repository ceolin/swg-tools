[project]
name = "swg-tools"
version = "0.1.0"
description = "Tools for the Zephyr Project security working group"
requires-python = ">=3.13"
dependencies = [
    "click>=8.0",
    "requests>=2.33.1",
    "libsql>=0.1.11",
]

[project.scripts]
ghsa = "ghsa.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["ghsa*"]

[tool.setuptools.package-data]
ghsa = ["*.md"]
