# Central MySQL database for the ghsa tool. Run ./setup.sh first to create
# the secrets and TLS certificates this file mounts.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_pw
      MYSQL_DATABASE: ghsa
    command:
      - --require-secure-transport=ON
      - --ssl-ca=/etc/mysql/certs/ca.pem
      - --ssl-cert=/etc/mysql/certs/server-cert.pem
      - --ssl-key=/etc/mysql/certs/server-key.pem
    ports:
      - "${MYSQL_BIND:-0.0.0.0}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./certs/ca.pem:/etc/mysql/certs/ca.pem:ro
      - ./certs/server-cert.pem:/etc/mysql/certs/server-cert.pem:ro
      - ./certs/server-key.pem:/etc/mysql/certs/server-key.pem:ro
    secrets:
      - root_pw
      - ghsa_pw

secrets:
  root_pw:
    file: ./secrets/root_pw
  ghsa_pw:
    file: ./secrets/ghsa_pw

volumes:
  mysql-data:
